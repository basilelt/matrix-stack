# dock.mau.dev is a self-hosted GitLab container registry with a separate JWT auth server.
# WUD requires two vars: _URL = registry host (images), _AUTHURL = GitLab auth host (JWT).
# Add a mau.dev read_registry PAT to .env as MAUDEV_TOKEN to enable authenticated pulls.
# Without the correct URL/AUTHURL split, all mautrix images error "Unsupported Registry unknown".
x-wud-calver: &wud-calver
  labels:
    wud.watch: "true"
    wud.tag.include: '^v0\.\d{4}\.\d+$$'
    wud.compose.file: /wud/docker-compose.yml

x-wud-semver: &wud-semver
  labels:
    wud.watch: "false"
    wud.tag.include: '^v\d+\.\d+\.\d+$$'
    wud.compose.file: /wud/docker-compose.yml

x-wud-off: &wud-off
  labels:
    wud.watch: "false"

services:

  postgres:
    image: postgres:16-alpine
    <<: *wud-off
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: ${TZ}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:v1.155.0
    <<: *wud-off
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_DOMAIN}
      SYNAPSE_REPORT_STATS: "no"
      TZ: ${TZ}
    volumes:
      - ./synapse:/data
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.20.0
    <<: *wud-off
    profiles:
      - mas
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./mas/config.yaml:/config.yaml:ro
    command: ["server", "--config", "/config.yaml"]
    # No healthcheck: the image ships only the mas-cli binary (no wget/curl/shell), and
    # `mas-cli doctor` makes external network calls (well-known lookup) — too heavy/flaky
    # for frequent polling. Nothing depends_on this service's health.
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    <<: *wud-off
    depends_on:
      synapse:
        condition: service_started
    ports:
      - "${CADDY_PORT:-8080}:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./stickers/web:/srv/stickerpicker:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mautrix-whatsapp:
    build:
      context: ./bridges/whatsapp
      dockerfile: Dockerfile.patched
    image: mautrix-whatsapp:patched
    <<: *wud-off
    profiles:
      - whatsapp
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/whatsapp:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29318/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:v0.2608.0
    <<: *wud-calver
    profiles:
      - telegram
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/telegram:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29317/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-signal:
    image: dock.mau.dev/mautrix/signal:v0.2608.0
    <<: *wud-calver
    profiles:
      - signal
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/signal:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29328/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-discord:
    image: dock.mau.dev/mautrix/discord:v0.7.6
    <<: *wud-semver
    profiles:
      - discord
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/discord:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29334/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-slack:
    image: dock.mau.dev/mautrix/slack:v0.2608.0
    <<: *wud-calver
    profiles:
      - slack
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/slack:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29335/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-gmessages:
    image: dock.mau.dev/mautrix/gmessages:v0.2608.0
    <<: *wud-calver
    profiles:
      - gmessages
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/gmessages:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29336/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-twitter:
    image: dock.mau.dev/mautrix/twitter:v0.2608.0
    <<: *wud-calver
    profiles:
      - twitter
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/twitter:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29337/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-googlechat:
    image: dock.mau.dev/mautrix/googlechat:v0.5.2
    <<: *wud-semver
    profiles:
      - googlechat
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/googlechat:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29338/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-linkedin:
    image: dock.mau.dev/mautrix/linkedin:v0.2608.0
    <<: *wud-calver
    profiles:
      - linkedin
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/linkedin:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29341/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-meta-fb:
    image: dock.mau.dev/mautrix/meta:v0.2608.0
    <<: *wud-calver
    profiles:
      - meta-fb
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/meta-fb:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29340/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mautrix-meta-ig:
    image: dock.mau.dev/mautrix/meta:ig-v0.2608.0
    labels:
      wud.watch: "true"
      wud.tag.include: '^ig-v0\.\d{4}\.\d+$$'
      wud.compose.file: /wud/docker-compose.yml
    profiles:
      - meta-ig
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./bridges/meta-ig:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:29341/_matrix/mau/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    <<: *wud-semver
    profiles:
      - translate
    environment:
      LT_DISABLE_WEB_UI: "false"
      LT_LOAD_ONLY: "${LT_LANGUAGES:-en,fr,es,de,pt,it,ar,zh,ja}"
      LT_UPDATE_MODELS: "false"
    volumes:
      - ./libretranslate/data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  matrix-translate-bot:
    build:
      context: ./translate-bot
      dockerfile: Dockerfile
    image: matrix-translate-bot:local
    <<: *wud-off
    profiles:
      - translate
    depends_on:
      synapse:
        condition: service_started
      libretranslate:
        condition: service_healthy
    volumes:
      - ./translate-bot/config.json:/app/config.json:ro
      - ./translate-bot/data/store:/app/store
      - ./translate-bot/data/models:/app/models
    environment:
      TZ: ${TZ}
    restart: unless-stopped

  claude-notify-bot:
    build:
      context: ./claude-notify-bot
      dockerfile: Dockerfile
    image: claude-notify-bot:local
    <<: *wud-off
    profiles:
      - claude-notify
    depends_on:
      synapse:
        condition: service_started
    ports:
      - "${CLAUDE_NOTIFY_BIND:-0.0.0.0}:8095:8095"
    volumes:
      - ./claude-notify-bot/config.json:/app/config.json:ro
      - ./claude-notify-bot/data/store:/app/store
    environment:
      TZ: ${TZ}
    restart: unless-stopped

  matrix-sticker-importer:
    build:
      context: ./stickers
      dockerfile: Dockerfile
    image: matrix-sticker-importer:local
    <<: *wud-off
    command: ["python3", "import.py"]
    profiles:
      - stickers
    depends_on:
      synapse:
        condition: service_started
    volumes:
      - ./stickers/config.json:/app/config.json:ro
      - ./stickers/data:/app/data
      - ./stickers/web/packs:/app/packs
      - ./stickers/input:/input:ro
    environment:
      TZ: ${TZ}
    restart: "no"

  matrix-sticker-bot:
    image: matrix-sticker-importer:local
    <<: *wud-off
    command: ["python3", "bot.py"]
    profiles:
      - stickers
    depends_on:
      synapse:
        condition: service_started
    volumes:
      - ./stickers/config.json:/app/config.json:ro
      - ./stickers/data:/app/data
      - ./stickers/web/packs:/app/packs
    environment:
      TZ: ${TZ}
    restart: unless-stopped

  wud:
    image: getwud/wud
    <<: *wud-off
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/wud/docker-compose.yml
    environment:
      - WUD_WATCHER_LOCAL_CRON=0 * * * *
      - WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_FILE=/wud/docker-compose.yml
      - WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_BACKUP=true
      - WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_PRUNE=true
      - WUD_REGISTRY_GITLAB_MAUDEV_URL=https://dock.mau.dev
      - WUD_REGISTRY_GITLAB_MAUDEV_AUTHURL=https://mau.dev
      - WUD_REGISTRY_GITLAB_MAUDEV_TOKEN=${MAUDEV_TOKEN}
